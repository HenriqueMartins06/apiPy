<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Lanchonete</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      <h2>🍔 Lanchonete</h2>
      <p>Sistema de Gestão</p>
    </div>

    <a href="/">🏠 Dashboard</a>
    <a href="/clientes-page">👥 Clientes</a>
    <a href="/produtos-page">🍟 Produtos</a>
    <a href="/pedidos-page">🧾 Pedidos</a>
    <a href="/item-pedido-page">🛒 Itens do Pedido</a>
    <a href="/forma-pagamento-page">💳 Formas de Pagamento</a>
  </aside>

  <main class="conteudo">
    <div class="card">
      <h1>Controle da Lanchonete</h1>
      <p>Gerencie clientes, produtos, pedidos, itens e formas de pagamento.</p>
    </div>

    <div class="dashboard">
      <div class="stat">
        <h3>Clientes</h3>
        <p id="totalClientes">0</p>
      </div>

      <div class="stat">
        <h3>Produtos</h3>
        <p id="totalProdutos">0</p>
      </div>

      <div class="stat">
        <h3>Pedidos</h3>
        <p id="totalPedidos">0</p>
      </div>

      <div class="stat">
        <h3>Formas de Pagamento</h3>
        <p id="totalPagamentos">0</p>
      </div>
    </div>

    <div class="card">
      <h2>Ações rápidas</h2>

      <div class="acoes">
        <a href="/clientes-page"><button>Cadastrar Cliente</button></a>
        <a href="/produtos-page"><button>Adicionar Produto</button></a>
        <a href="/pedidos-page"><button>Criar Pedido</button></a>
        <a href="/forma-pagamento-page"><button>Forma de Pagamento</button></a>
      </div>
    </div>
  </main>

  <script src="/static/index.js"></script>
</body>
</html>
