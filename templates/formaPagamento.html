<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formas de Pagamento - Lanchonete</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

  <aside class="sidebar">

    <div class="logo">
      <h2><i class="bi bi-shop"></i> Lanchonete</h2>
      <p>Sistema de Gestão</p>
    </div>

    <a href="/">
      <i class="bi bi-house-door"></i>
      Dashboard
    </a>

    <a href="/clientes-page">
      <i class="bi bi-people"></i>
      Clientes
    </a>

    <a href="/produtos-page">
      <i class="bi bi-bag"></i>
      Produtos
    </a>

    <a href="/pedidos-page">
      <i class="bi bi-receipt"></i>
      Pedidos
    </a>

    <a href="/item-pedido-page">
      <i class="bi bi-cart"></i>
      Itens do Pedido
    </a>

    <a href="/forma-pagamento-page">
      <i class="bi bi-credit-card"></i>
      Formas de Pagamento
    </a>

  </aside>

  <main class="conteudo">

    <div class="mb-4">
      <h1 class="h3 mb-1">Formas de Pagamento</h1>
      <p class="text-muted">
        Cadastre, visualize, edite e exclua formas de pagamento.
      </p>
    </div>

    <div class="card shadow-sm border-0 mb-4">

      <div class="card-body">

        <h2 class="h5 mb-4">
          <i class="bi bi-credit-card-2-front"></i>
          Cadastro de Forma de Pagamento
        </h2>

        <form id="formPagamento">

          <input type="hidden" id="pagamentoId">

          <div class="mb-4">

            <label class="form-label">
              Tipo
            </label>

            <input
              id="tipoPagamento"
              type="text"
              class="form-control"
              placeholder="Pix, Cartão, Dinheiro..."
            >

          </div>

          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle"></i>
            Salvar Forma
          </button>

        </form>

      </div>

    </div>

    <div class="card shadow-sm border-0">

      <div class="card-body">

        <h2 class="h5 mb-4">
          <i class="bi bi-table"></i>
          Lista de Formas de Pagamento
        </h2>

        <div class="table-responsive">

          <table class="table table-hover align-middle">

            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th width="180">Ações</th>
              </tr>
            </thead>

            <tbody id="tabelaPagamentos">
              <tr>
                <td colspan="3" class="text-center">
                  Carregando formas de pagamento...
                </td>
              </tr>
            </tbody>

          </table>

        </div>

      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/formaPagamento.js"></script>
</body>
</html>
