<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes - Lanchonete</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      <h2>🍔 Lanchonete</h2>
      <p>Sistema de Gestão</p>
    </div>

    <a href="/">🏠 Dashboard</a>
    <a href="/clientes-page">👥 Clientes</a>
    <a href="/produtos-page">🍟 Produtos</a>
    <a href="/pedidos-page">🧾 Pedidos</a>
    <a href="/item-pedido-page">🛒 Itens do Pedido</a>
    <a href="/forma-pagamento-page">💳 Formas de Pagamento</a>
  </aside>

  <main class="conteudo">
    <div class="topo">
      <h1>Clientes</h1>
      <p>Cadastre, visualize, edite e exclua clientes.</p>
    </div>

    <div class="card">
      <h2>Cadastro de Cliente</h2>

      <form id="formCliente">
        <input type="hidden" id="clienteId">

        <label>Nome</label>
        <input id="nomeCliente" type="text" placeholder="Digite o nome do cliente">

        <label>Telefone</label>
        <input id="telefoneCliente" type="text" placeholder="Digite o telefone">

        <button type="submit">Salvar Cliente</button>
      </form>
    </div>

    <div class="card">
      <h2>Lista de Clientes</h2>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabelaClientes">
          <tr>
            <td colspan="4">Carregando clientes...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/static/clientes.js"></script>
</body>
</html>
