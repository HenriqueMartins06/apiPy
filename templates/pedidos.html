<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedidos - Lanchonete</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <aside class="sidebar">

    <div class="logo">
      <h2>🍔 Lanchonete</h2>
      <p>Sistema de Gestão</p>
    </div>

    <a href="/">🏠 Dashboard</a>
    <a href="/clientes-page">👥 Clientes</a>
    <a href="/produtos-page">🍟 Produtos</a>
    <a href="/pedidos-page">🧾 Pedidos</a>
    <a href="/item-pedido-page">🛒 Itens do Pedido</a>
    <a href="/forma-pagamento-page">💳 Formas de Pagamento</a>

  </aside>

  <main class="conteudo">

    <div class="topo">
      <h1>Pedidos</h1>
      <p>Cadastre, visualize, edite e exclua pedidos.</p>
    </div>

    <div class="card">

      <h2>Criar Pedido</h2>

      <form id="formPedido">

        <input type="hidden" id="pedidoId">

        <div class="campo">
          <label for="clientePedido">Cliente</label>

          <select id="clientePedido">
            <option value="">
              Selecione um cliente
            </option>
          </select>
        </div>

        <div class="campo">
          <label for="formaPedido">
            Forma de Pagamento
          </label>

          <select id="formaPedido">
            <option value="">
              Selecione uma forma
            </option>
          </select>
        </div>

        <button type="submit">
          Salvar Pedido
        </button>

      </form>

    </div>

    <div class="card">

      <h2>Lista de Pedidos</h2>

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Forma de Pagamento</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="tabelaPedidos">

          <tr>
            <td colspan="4">
              Carregando pedidos...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </main>

  <script src="/static/pedidos.js"></script>
</body>
</html>
