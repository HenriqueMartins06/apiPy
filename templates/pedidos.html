<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pedidos - Lanchonete</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

  <aside class="sidebar">

    <div class="logo">
      <h2>🍔 Lanchonete</h2>
      <p>Sistema de Gestão</p>
    </div>

    <a href="/">🏠 Dashboard</a>
    <a href="/clientes-page">👥 Clientes</a>
    <a href="/produtos-page">🍟 Produtos</a>
    <a href="/pedidos-page">🧾 Pedidos</a>
    <a href="/item-pedido-page">🛒 Itens do Pedido</a>
    <a href="/forma-pagamento-page">💳 Formas de Pagamento</a>

  </aside>

  <main class="conteudo">

    <div class="mb-4">
      <h1 class="h3 mb-1">Pedidos</h1>
      <p class="text-muted">
        Cadastre, visualize, edite e exclua pedidos.
      </p>
    </div>

    <div class="card shadow-sm border-0 mb-4">

      <div class="card-body">

        <h2 class="h5 mb-4">Criar Pedido</h2>

        <form id="formPedido">

          <input type="hidden" id="pedidoId">

          <div class="mb-3">

            <label for="clientePedido" class="form-label">
              Cliente
            </label>

            <select id="clientePedido" class="form-select">
              <option value="">
                Selecione um cliente
              </option>
            </select>

          </div>

          <div class="mb-4">

            <label for="formaPedido" class="form-label">
              Forma de Pagamento
            </label>

            <select id="formaPedido" class="form-select">
              <option value="">
                Selecione uma forma
              </option>
            </select>

          </div>

          <button type="submit" class="btn btn-danger">
            Salvar Pedido
          </button>

        </form>

      </div>

    </div>

    <div class="card shadow-sm border-0">

      <div class="card-body">

        <h2 class="h5 mb-4">Lista de Pedidos</h2>

        <div class="table-responsive">

          <table class="table table-hover align-middle">

            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Forma de Pagamento</th>
                <th width="180">Ações</th>
              </tr>
            </thead>

            <tbody id="tabelaPedidos">

              <tr>
                <td colspan="4" class="text-center">
                  Carregando pedidos...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/pedidos.js"></script>
</body>
</html>
