<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Itens do Pedido - Lanchonete</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

  <aside class="sidebar">

    <div class="logo">
      <h2>🍔 Lanchonete</h2>
      <p>Sistema de Gestão</p>
    </div>

    <a href="/">🏠 Dashboard</a>
    <a href="/clientes-page">👥 Clientes</a>
    <a href="/produtos-page">🍟 Produtos</a>
    <a href="/pedidos-page">🧾 Pedidos</a>
    <a href="/item-pedido-page">🛒 Itens do Pedido</a>
    <a href="/forma-pagamento-page">💳 Formas de Pagamento</a>

  </aside>

  <main class="conteudo">

    <div class="mb-4">
      <h1 class="h3 mb-1">Itens do Pedido</h1>
      <p class="text-muted">
        Adicione produtos aos pedidos realizados.
      </p>
    </div>

    <div class="card shadow-sm border-0 mb-4">

      <div class="card-body">

        <h2 class="h5 mb-4">Adicionar Item</h2>

        <form id="formItemPedido">

          <input type="hidden" id="itemPedidoId">

          <div class="mb-3">

            <label for="pedidoItem" class="form-label">
              Pedido
            </label>

            <select id="pedidoItem" class="form-select">
              <option value="">
                Selecione um pedido
              </option>
            </select>

          </div>

          <div class="mb-3">

            <label for="produtoItem" class="form-label">
              Produto
            </label>

            <select id="produtoItem" class="form-select">
              <option value="">
                Selecione um produto
              </option>
            </select>

          </div>

          <div class="mb-4">

            <label for="quantidadeItem" class="form-label">
              Quantidade
            </label>

            <input
              type="number"
              id="quantidadeItem"
              class="form-control"
              placeholder="Digite a quantidade"
            >

          </div>

          <button type="submit" class="btn btn-danger">
            Salvar Item
          </button>

        </form>

      </div>

    </div>

    <div class="card shadow-sm border-0">

      <div class="card-body">

        <h2 class="h5 mb-4">Itens por Pedido</h2>

        <div id="listaItensPedido" class="d-flex flex-column gap-3">
          Carregando itens...
        </div>

      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/itemPedido.js"></script>
</body>
</html>
